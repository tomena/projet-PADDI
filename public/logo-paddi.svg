  <text x="143" y="86" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">Programme d'Appui au Développement Durable et Intégré</text>
  <text x="143" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280">Communautés et services écosystémiques</text>
