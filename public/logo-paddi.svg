<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">PADDI+ – Programme d'Appui au Développement Durable et Intégré</title>
  <defs>
    <path id="petale" d="M0 25A25 25 0 0 1 25 0A25 25 0 0 1 50 25L50 50L25 50A25 25 0 0 1 0 25Z"/>
