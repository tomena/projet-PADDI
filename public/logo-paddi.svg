    <use href="#petale" fill="#1b7fa8" transform="translate(114 6) scale(-1 1)"/>
    <use href="#petale" fill="#b8742a" transform="translate(6 114) scale(1 -1)"/>
    <use href="#petale" fill="#c2512f" transform="translate(114 114) scale(-1 -1)"/>
  </g>

  <!-- Nom et sous-titre -->
